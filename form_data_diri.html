<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulir Data Diri</title>
    <style>
        body {
            font-family: Arial, Helvetica, sans-serif;
            margin: 30px;
            color: #111;
        }
        .container {
            max-width: 550px;
        }
        h2 {
            margin-bottom: 20px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 16px;
        }
        label.title {
            display: block;
            font-weight: bold;
            margin-bottom: 6px;
            font-size: 14px;
        }
        input[type="text"],
        input[type="date"] {
            width: 100%;
            padding: 8px 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 14px;
        }
        .checkbox-group label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .checkbox-group input[type="checkbox"] {
            margin-right: 6px;
        }
        button {
            background-color: #0d6efd;
            color: white;
            border: none;
            padding: 9px 16px;
            border-radius: 4px;
            font-size: 14px;
            cursor: pointer;
            margin-top: 4px;
        }
        button:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>Formulir Data Diri</h2>
    
    <form action="proses_data_diri.php" method="POST">
        <div class="form-group">
            <label for="nama" class="title">Nama Lengkap:</label>
            <input type="text" id="nama" name="nama" required>
        </div>

        <div class="form-group">
            <label for="tgl_lahir" class="title">Tanggal Lahir:</label>
            <input type="date" id="tgl_lahir" name="tgl_lahir" required>
        </div>

        <div class="form-group">
            <label class="title">Hobi:</label>
            <div class="checkbox-group">
                <label><input type="checkbox" name="hobi[]" value="Membaca"> Membaca</label>
                <label><input type="checkbox" name="hobi[]" value="Olahraga"> Olahraga</label>
                <label><input type="checkbox" name="hobi[]" value="Musik"> Musik</label>
                <label><input type="checkbox" name="hobi[]" value="Lainnya"> Lainnya</label>
            </div>
        </div>

        <button type="submit">Kirim</button>
    </form>
</div>

</body>
</html>
